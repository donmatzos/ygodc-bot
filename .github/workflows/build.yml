name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # test-reporter publishes the report as a check run

jobs:
  build:
    runs-on: ubuntu-latest

    # Throwaway database for the DB tests (they drop their tables); same image as the local test database.
    # Pulled from the ECR Public mirror of Docker's official images: anonymous Docker Hub pulls from shared runners
    # often hit the rate limit.
    services:
      mariadb:
        image: public.ecr.aws/docker/library/mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: ygotest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles, runs all tests (including the DB tests against the service above) and builds the fat jar
      - name: Build and test
        run: mvn -B verify
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/ygotest
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test

      - name: Test report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ygo-discord-bot
          path: target/ygo-discord-bot.jar
